name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # On stdio, stdout must carry only the MCP protocol: nothing at startup
      - name: Startup writes nothing to stdout
        run: |
          out=$(EXA_API_KEY=ci-placeholder NODE_ENV=production timeout 3 node build/index.js < /dev/null 2>/dev/null || true)
          test -z "$out" || { echo "unexpected stdout: $out"; exit 1; }
      - name: --list-tools works without an API key
        run: node build/index.js --list-tools > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t exa-mcp-server:ci .
      - name: Image starts and lists tools without a key
        run: docker run --rm exa-mcp-server:ci --list-tools > /dev/null
